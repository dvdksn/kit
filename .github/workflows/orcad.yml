name: Test orcad
on:
  pull_request:
    paths:
      - kits/orcad/**
      - .github/workflows/orcad.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test pairing and a terminal command in the shell base
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build kits/orcad -f kits/orcad/orcad.dockerfile \
            --platform "linux/$ARCH" --target test --progress plain
      - name: Build the kit OCI artifact
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build kits/orcad -f kits/orcad/orcad.yaml \
            --platform "linux/$ARCH" --progress plain --provenance=false \
            --output "type=oci,dest=$RUNNER_TEMP/orcad.tar"
