name: Test kits
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n kits/github-clone/clone.sh

  shell:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the shell on its native architecture
        run: docker buildx build kits/shell -f kits/shell/shell.dockerfile --pull --load -t kit-shell:test
      - name: Compile and run C++ as the agent user
        run: |
          docker run --rm --network none kit-shell:test -c '
            set -eu
            test "$(id -u)" = 1000
            cd "$(mktemp -d)"
            printf "#include <iostream>\nint main() { std::cout << 42; }\n" > smoke.cpp
            g++ smoke.cpp -o smoke
            test "$(./smoke)" = 42
          '
