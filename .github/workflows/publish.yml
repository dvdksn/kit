name: Publish kits
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Consumed by docker-bake.hcl, which defines the kits and their tags.
  TAG: ${{ github.sha }}
  LATEST: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  mixins:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the mixins for ${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: docker buildx bake mixins --push

  publish:
    needs: mixins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the shell for both platforms
        run: docker buildx bake shell --push
      - name: Publish both architectures under each mixin tag
        run: |
          set -euo pipefail
          # Reuse the bake definition: its per-arch tag is <image>:<tag>-<arch>.
          docker buildx bake mixins --print \
            | jq -r '.target[].tags[0] | split(":") | "\(.[0]) \(.[1])"' \
            | while read -r image tag; do
                tags=(--tag "$image:$tag")
                if [ "$LATEST" = true ]; then tags+=(--tag "$image:latest"); fi
                docker buildx imagetools create "${tags[@]}" "$image:$tag-amd64" "$image:$tag-arm64"
              done
