name: Publish kits
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/dvdksn/kit

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n kits/github-clone/clone.sh kits/github-clone/credential.sh

  components:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push components from this checkout
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for kit in claude-mixin codex-mixin github-ssh git-signing rumdl github-clone; do
            docker buildx build "kits/$kit" -f "kits/$kit/$kit.yaml" \
            --platform "linux/$ARCH" --pull --no-cache --provenance=false --push \
            --tag "$IMAGE_PREFIX-$kit:$GITHUB_SHA-$ARCH"
          done

  component-indexes:
    needs: components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the shell with a shared package declaration
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE_PREFIX-shell:$GITHUB_SHA")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(--tag "$IMAGE_PREFIX-shell:latest"); fi
          docker buildx build kits/shell -f kits/shell/shell.yaml \
            --platform linux/amd64,linux/arm64 --pull --no-cache --provenance=false --push \
            "${tags[@]}"
      - name: Publish both architectures under each component tag
        run: |
          set -euo pipefail
          for kit in claude-mixin codex-mixin github-ssh git-signing rumdl github-clone; do
            tags=(--tag "$IMAGE_PREFIX-$kit:$GITHUB_SHA")
            if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(--tag "$IMAGE_PREFIX-$kit:latest"); fi
            docker buildx imagetools create "${tags[@]}" \
              "$IMAGE_PREFIX-$kit:$GITHUB_SHA-amd64" \
              "$IMAGE_PREFIX-$kit:$GITHUB_SHA-arm64"
          done

  tools-set:
    needs: component-indexes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the tools mixin set
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE_PREFIX-tools:$GITHUB_SHA")
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(--tag "$IMAGE_PREFIX-tools:latest"); fi
          docker buildx build kits/tools -f kits/tools/tools.yaml \
            --platform linux/amd64,linux/arm64 \
            --build-arg "revision=$GITHUB_SHA" \
            --provenance=false --push \
            "${tags[@]}"
