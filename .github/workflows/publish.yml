name: Publish kits
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dvdksn/kit

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push components from this checkout
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for kit in claude-mixin codex-mixin github-ssh git-signing github-clone rumdl; do
            docker buildx build "kits/$kit" -f "kits/$kit/$kit.yaml" \
            --platform "linux/$ARCH" --pull --no-cache --provenance=false --push \
            --tag "$IMAGE:$kit-$GITHUB_SHA-$ARCH"
          done

  component-indexes:
    needs: components
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the shell with a shared package declaration
        run: |
          docker buildx build kits/shell -f kits/shell/shell.yaml \
            --platform linux/amd64,linux/arm64 --pull --no-cache --provenance=false --push \
            --tag "$IMAGE:shell-$GITHUB_SHA" --tag "$IMAGE:shell-latest"
      - name: Publish both architectures under each component tag
        run: |
          set -euo pipefail
          for kit in claude-mixin codex-mixin github-ssh git-signing github-clone rumdl; do
            docker buildx imagetools create \
            --tag "$IMAGE:$kit-$GITHUB_SHA" \
            --tag "$IMAGE:$kit-latest" \
              "$IMAGE:$kit-$GITHUB_SHA-amd64" \
              "$IMAGE:$kit-$GITHUB_SHA-arm64"
          done

  set:
    needs: component-indexes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the complete kit set
        run: |
          docker buildx build . -f kit.yaml \
            --platform linux/amd64,linux/arm64 \
            --build-arg "revision=$GITHUB_SHA" \
            --provenance=false --push \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:latest"
