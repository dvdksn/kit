# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Project conversation history
description: Connect selected Codex and Claude state to a project history mount.
sourceUrl: https://github.com/dvdksn/kit
version: "1.0.0"
provides: ["project-history@1.0.0"]
capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        sup can mount project history at /home/agent/project-history and run
        sup-history to connect Codex and Claude transcripts to it. History is
        project-local and survives sandbox recreation. Configuration and
        credentials stay in the sandbox. Repositories and worktrees are not
        backed up by this history mount.
