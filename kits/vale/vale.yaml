# syntax=docker/sandbox-kit:3
# MIGRATION NOTE: v2's pinned install hook becomes a latest-stable,
# checksum-verified binary overlay. Release downloads now happen at build
# time, so they require no install-time sandbox network grants.
schemaVersion: "3"
version: "1.0.0"
sourceUrl: https://github.com/dvdksn/kit
licenses: [Apache-2.0]
displayName: Vale
description: Latest stable Vale prose linter as a binary overlay
kind: mixin
capabilities:
  # Keep GitHub access for `vale sync`, which fetches repository styles.
  # Other style sources follow the sandbox's existing network policy.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com:443
          - objects.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./vale-context.md
