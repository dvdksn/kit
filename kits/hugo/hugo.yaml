# syntax=docker/sandbox-kit:3
# MIGRATION NOTE: v2's pinned install hook becomes a latest-stable,
# checksum-verified binary overlay. Release downloads now happen at build
# time, so they require no install-time sandbox network grants.
schemaVersion: "3"
version: "1.0.0"
sourceUrl: https://github.com/dvdksn/kit
licenses: [Apache-2.0]
displayName: Hugo Extended
description: Latest stable Hugo Extended static site generator as a binary overlay
kind: mixin
capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./hugo-context.md
