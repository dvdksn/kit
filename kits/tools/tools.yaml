# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: set
displayName: Development tools
description: GitHub clone, SSH access, Git signing, and Markdown linting mixins.
sourceUrl: https://github.com/dvdksn/kit
licenses: [Apache-2.0]
args:
  repo:
    required: true
    description: GitHub repository in owner/repo form
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$'
  ref:
    default: ""
    description: Optional branch, tag, or commit; mutually exclusive with pr
    pattern: '^([A-Za-z0-9][A-Za-z0-9._/-]*)?$'
  pr:
    default: ""
    description: Optional pull request number to check out
    pattern: '^[0-9]*$'
  revision:
    default: latest
    pattern: '^[a-zA-Z0-9_.-]+$'
    description: Component build tag; CI uses the full Git commit SHA
    buildArg: KIT_REVISION
kits:
  - ref: ghcr.io/dvdksn/kit-github-ssh:${{ kit.args.revision }}
  - ref: ghcr.io/dvdksn/kit-git-signing:${{ kit.args.revision }}
  - ref: ghcr.io/dvdksn/kit-github-clone:${{ kit.args.revision }}
    args:
      repo: ${{ kit.args.repo }}
      ref: ${{ kit.args.ref }}
      pr: ${{ kit.args.pr }}
  - ref: ghcr.io/dvdksn/kit-rumdl:${{ kit.args.revision }}
