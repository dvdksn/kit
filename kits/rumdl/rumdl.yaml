# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: rumdl
description: Markdown linting and formatting with the pinned rumdl release used by Docker docs.
sourceUrl: https://github.com/dvdksn/kit
licenses: [Apache-2.0]
version: "${{ kit.args.version }}"
args:
  version:
    default: "0.2.49"
    enum: ["0.2.49"]
    description: rumdl release; update the recipe checksums when changing it
    buildArg: RUMDL_VERSION
provides: ["rumdl@${{ kit.args.version }}"]
# The v2 install download becomes image content, so no sandbox network grant
# or root install hook is needed for this tool.
capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./rumdl-context.md
