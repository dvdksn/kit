# syntax=docker/sandbox-kit:3
schemaVersion: "3"
version: "1.0.0"
sourceUrl: https://github.com/dvdksn/kit
licenses: [Apache-2.0]
displayName: Neovim
description: Latest stable Neovim with its runtime and a plugin-free starter configuration
kind: mixin
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: /usr/local/share/neovim-kit/seed-config.sh
          user: agent
          env: [XDG_CONFIG_HOME, NVIM_APPNAME]
          description: Seed starter Neovim config without replacing existing user configuration
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./neovim-context.md
